name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (venv + deps + Deno)
        run: ./install.sh

      - name: Install dev dependencies
        run: venv/bin/pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Version check
        run: venv/bin/python ytm-ll-dl-modern.py --version

      - name: Help check
        run: venv/bin/python ytm-ll-dl-modern.py --help

      - name: Compile check
        run: venv/bin/python -m py_compile ytm-ll-dl-modern.py

      - name: Headless tests
        run: venv/bin/python -m pytest tests/ -q

      - name: Virtualenv guard (outside venv must refuse)
        run: |
          set +e
          # python3 here is the CI system python, NOT ./venv, so the
          # app must refuse to start and exit non-zero.
          output=$(python3 ytm-ll-dl-modern.py --version 2>&1)
          exit_code=$?
          set -e
          if [ $exit_code -eq 0 ]; then
            echo "FAIL: running without a virtualenv must not work" >&2
            exit 1
          fi
          case "$output" in
            *"must run from inside a virtualenv"*)
              echo "Guard OK (exit $exit_code)";;
            *)
              echo "Unexpected guard output:" >&2
              echo "$output" >&2
              exit 1;;
          esac

      - name: Secret scan (tracked files must not contain credentials)
        run: |
          # Exclude this workflow itself: it contains the literal patterns
          # below, which would otherwise make the scan self-match.
          matches=$(git grep -I -E -l 'SAPISID|SIDCC|__Secure-|PASTE YOUR' -- . ':(exclude).github/workflows/ci.yml' 2>/dev/null || true)
          if [ -n "$matches" ]; then
            echo "FAIL: credential patterns found in tracked files:" >&2
            echo "$matches" >&2
            exit 1
          fi
          echo "Secret scan OK"

      - name: No secret state committed
        run: |
          test ! -e accounts/ -o -z "$(ls -A accounts 2>/dev/null)" || { echo "accounts/ not empty"; exit 1; }
          test ! -e files/ -o -z "$(ls -A files 2>/dev/null)" || { echo "files/ not empty"; exit 1; }
          echo "State dirs clean"

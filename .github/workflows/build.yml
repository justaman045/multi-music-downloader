name: Build executables

# Builds the standalone single-file executables (Windows, Linux,
# macOS x64 + arm64) on EVERY push to main/master and publishes them
# as a rolling "latest-build" prerelease, so users can always grab a
# fresh binary without waiting for a version tag. The build matrix and
# smoke test mirror .github/workflows/release.yml (which still owns
# tagged v* releases); this workflow never matches v* tags, so the two
# cannot trigger each other.

on:
  push:
    branches: [main, master]

permissions:
  contents: write

# Serialize builds so two pushes don't race on the same release assets.
# cancel-in-progress is true on purpose: a *newer* push supersedes an older
# build, and without it a run stuck waiting for a scarce runner (macOS jobs
# have been queued for hours) blocks every later push forever, because
# cancel-in-progress: false makes the group strictly first-come-first-served.
concurrency:
  group: build-executables-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Gate (tests must pass)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (venv + deps + Deno)
        run: ./install.sh

      - name: Install dev dependencies
        run: venv/bin/pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Headless tests
        run: venv/bin/python -m pytest tests/ -q

  build:
    name: Build (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    # A macOS job can sit queued for hours waiting for a scarce runner.
    # Cap the whole job so it fails cleanly (and publish can still run for
    # the platforms that did build) instead of hanging the pipeline.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: YTMusicDownloader-windows-x64.exe
          - os: ubuntu-latest
            artifact: YTMusicDownloader-linux-x64
          - os: macos-15
            artifact: YTMusicDownloader-macos-arm64
          - os: macos-15-intel
            artifact: YTMusicDownloader-macos-x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies (Unix)
        if: runner.os != 'Windows'
        run: |
          python -m venv buildvenv
          buildvenv/bin/pip install --disable-pip-version-check -r packaging/requirements-build.txt

      - name: Install build dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m venv buildvenv
          buildvenv\Scripts\pip install --disable-pip-version-check -r packaging\requirements-build.txt

      # Deno is fetched from the denoland/deno GitHub release. All four
      # matrix jobs run concurrently from the same egress IP, which is
      # what tripped GitHub's rate limit ("HTTP 403 rate limit exceeded")
      # and broke the macOS jobs. Cache it so the download normally
      # doesn't happen at all; packaging/build.py also retries with
      # backoff and degrades gracefully if it still fails.
      - name: Cache Deno
        uses: actions/cache@v4
        with:
          path: packaging/.vendor
          key: deno-vendor-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packaging/build.py') }}

      - name: Build standalone executable (Unix)
        if: runner.os != 'Windows'
        run: buildvenv/bin/python packaging/build.py

      - name: Build standalone executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: buildvenv\Scripts\python packaging\build.py

      - name: Smoke test (version + help + frozen paths)
        shell: bash
        run: |
          if [ -f dist/YTMusicDownloader.exe ]; then
            BIN=dist/YTMusicDownloader.exe
          else
            BIN=dist/YTMusicDownloader
            chmod +x "$BIN"
          fi
          "$BIN" --version
          "$BIN" --help
          # Frozen-mode path check: run with an isolated data dir and
          # confirm it initializes accounts/files/config there.
          export YTM_DATA_DIR="$RUNNER_TEMP/ytm-smoke"
          mkdir -p "$YTM_DATA_DIR"
          "$BIN" --version
          # A bundled Deno is nice-to-have (it saves a first-run download),
          # not a build requirement — report it without failing.
          if [ -f packaging/.vendor/deno ] || [ -f packaging/.vendor/deno.exe ]; then
            echo "Bundled Deno: yes"
          else
            echo "Bundled Deno: no (the app will fetch it on first run)"
          fi
          # Resilience check: GitHub rate-limits the Deno release API by IP
          # (HTTP 403 "rate limit exceeded"), which is exactly what broke
          # this job before. Force the app to fetch Deno into a *fresh* data
          # dir with no network at all, and require it to warn and keep
          # working instead of aborting.
          #
          # NOTE: no `timeout(1)` wrapper — macOS runners do not ship the GNU
          # coreutils build, and `timeout: command not found` made this step
          # exit 127 and fail the macOS jobs. The app has its own short
          # urlopen timeouts and bounded retries, so it cannot hang here.
          export YTM_DATA_DIR="$RUNNER_TEMP/ytm-cold"
          rm -rf "$YTM_DATA_DIR"
          mkdir -p "$YTM_DATA_DIR"
          set +e
          out=$(YTM_FORCE_DENO_FETCH=1 \
                YTM_RETRY_BACKOFF_DELAY=0.1 \
                HTTPS_PROXY="http://127.0.0.1:9" HTTP_PROXY="http://127.0.0.1:9" \
                "$BIN" --version 2>&1)
          code=$?
          set -e
          echo "$out"
          if [ $code -ne 0 ]; then
            echo "FAIL: binary exited $code when the Deno fetch failed" >&2
            exit 1
          fi
          case "$out" in
            *"v6."*) ;;
            *) echo "FAIL: --version output not recognised" >&2; exit 1;;
          esac
          echo "Cold-start / Deno-fetch resilience OK (exit $code)"
          echo "Smoke test OK"

      - name: Ad-hoc codesign (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --force --sign - dist/YTMusicDownloader || true

      - name: Rename artifact
        shell: bash
        run: |
          if [ -f dist/YTMusicDownloader.exe ]; then
            mv dist/YTMusicDownloader.exe "dist/${{ matrix.artifact }}"
          else
            mv dist/YTMusicDownloader "dist/${{ matrix.artifact }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  publish:
    name: Publish latest-build release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Point the rolling tag at this commit
        run: git push --force origin "${GITHUB_SHA}:refs/tags/latest-build"

      - name: Publish (or refresh) the latest-build prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest-build >/dev/null 2>&1; then
            # Same-named assets are replaced (--clobber), so the
            # download links stay stable across pushes.
            gh release upload latest-build dist/* --clobber
          else
            gh release create latest-build dist/* \
              --prerelease \
              --title "Latest build (every push to main)" \
              --notes "Automatically rebuilt from every push to main/master. The same four standalone binaries as tagged releases; see the README for platform-specific run notes."
          fi
          echo "Assets now on the release:"
          gh release view latest-build --json assets --jq '.assets[].name'
          echo "[Download latest-build](https://github.com/${GITHUB_REPOSITORY}/releases/tag/latest-build)" >> "$GITHUB_STEP_SUMMARY"

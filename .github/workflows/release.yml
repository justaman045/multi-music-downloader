name: Release

# Builds the standalone single-file executables (Windows, Linux,
# macOS x64 + arm64) and attaches them to a GitHub Release when a
# version tag (v*) is pushed. The normal CI workflow is untouched.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # macOS runners can take hours to become available; a cap keeps a
    # starved job from hanging the release instead of failing cleanly.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: YTMusicDownloader-windows-x64.exe
          - os: ubuntu-latest
            artifact: YTMusicDownloader-linux-x64
          - os: macos-14
            artifact: YTMusicDownloader-macos-arm64
          - os: macos-13
            artifact: YTMusicDownloader-macos-x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies (Unix)
        if: runner.os != 'Windows'
        run: |
          python -m venv buildvenv
          buildvenv/bin/pip install --disable-pip-version-check -r packaging/requirements-build.txt

      - name: Install build dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m venv buildvenv
          buildvenv\Scripts\pip install --disable-pip-version-check -r packaging\requirements-build.txt

      # Deno is fetched from the denoland/deno GitHub release; four
      # concurrent matrix jobs share one egress IP and can hit GitHub's
      # rate limit. Cache it, and packaging/build.py retries with
      # backoff + degrades gracefully. Keep in sync with build.yml.
      - name: Cache Deno
        uses: actions/cache@v4
        with:
          path: packaging/.vendor
          key: deno-vendor-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packaging/build.py') }}

      - name: Build standalone executable (Unix)
        if: runner.os != 'Windows'
        run: buildvenv/bin/python packaging/build.py

      - name: Build standalone executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: buildvenv\Scripts\python packaging\build.py

      - name: Smoke test (version + help + frozen paths)
        shell: bash
        run: |
          if [ -f dist/YTMusicDownloader.exe ]; then
            BIN=dist/YTMusicDownloader.exe
          else
            BIN=dist/YTMusicDownloader
            chmod +x "$BIN"
          fi
          "$BIN" --version
          "$BIN" --help
          # Frozen-mode path check: run with an isolated data dir and
          # confirm it initializes accounts/files/config there.
          export YTM_DATA_DIR="$RUNNER_TEMP/ytm-smoke"
          mkdir -p "$YTM_DATA_DIR"
          "$BIN" --version
          # A bundled Deno is nice-to-have (it saves a first-run download),
          # not a build requirement — report it without failing.
          if [ -f packaging/.vendor/deno ] || [ -f packaging/.vendor/deno.exe ]; then
            echo "Bundled Deno: yes"
          else
            echo "Bundled Deno: no (the app will fetch it on first run)"
          fi
          # Resilience check: GitHub rate-limits the Deno release API by IP
          # (HTTP 403 "rate limit exceeded"), which is exactly what broke
          # this job before. Force the app to fetch Deno into a *fresh* data
          # dir with no network at all, and require it to warn and keep
          # working instead of aborting.
          export YTM_DATA_DIR="$RUNNER_TEMP/ytm-cold"
          rm -rf "$YTM_DATA_DIR"
          mkdir -p "$YTM_DATA_DIR"
          # Remove any Deno the binary just unpacked, so the app really has
          # to fetch it and really fails.
          rm -f "$YTM_DATA_DIR"/bin/deno "$YTM_DATA_DIR"/bin/deno.exe
          set +e
          out=$(YTM_FORCE_DENO_FETCH=1 \
                HTTPS_PROXY="http://127.0.0.1:9" HTTP_PROXY="http://127.0.0.1:9" \
                timeout 300 "$BIN" --version 2>&1)
          code=$?
          set -e
          echo "$out"
          if [ $code -ne 0 ]; then
            echo "FAIL: binary exited $code when the Deno fetch failed" >&2
            exit 1
          fi
          case "$out" in
            *"v6."*) ;;
            *) echo "FAIL: --version output not recognised" >&2; exit 1;;
          esac
          echo "Cold-start / Deno-fetch resilience OK (exit $code)"
          echo "Smoke test OK"

      - name: Ad-hoc codesign (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --force --sign - dist/YTMusicDownloader || true

      - name: Rename artifact
        shell: bash
        run: |
          if [ -f dist/YTMusicDownloader.exe ]; then
            mv dist/YTMusicDownloader.exe "dist/${{ matrix.artifact }}"
          else
            mv dist/YTMusicDownloader "dist/${{ matrix.artifact }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    name: Attach to release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
